name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - run: npm ci --prefix renderer
      - run: npm test --prefix renderer
      - run: emacs -Q --batch --eval '(setq native-comp-enable-subr-trampolines nil)' -L . -l test/supernote-view-test.el -f ert-run-tests-batch-and-exit
